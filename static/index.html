<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buddy 🧸 English for Kids</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#3b2f2f;--pri:#ff8a3d;--ok:#4cc38a}
@media(prefers-color-scheme:dark){:root{--bg:#2a2320;--card:#3a302b;--ink:#fdf3e7}}
*{box-sizing:border-box}body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh}
header{padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--pri);color:#fff;font-size:1.1rem}
.badges span{background:rgba(255,255,255,.25);border-radius:14px;padding:3px 10px;margin-left:6px;font-size:.85rem}
#log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.b{max-width:85%;padding:12px 16px;border-radius:20px;font-size:1.25rem;line-height:1.4;background:var(--card)}
.me{align-self:flex-end;background:var(--ok);color:#fff}
form{display:flex;gap:8px;padding:10px;background:var(--card)}
input{flex:1;font-size:1.2rem;padding:12px;border-radius:14px;border:2px solid var(--pri);background:transparent;color:var(--ink)}
button{font-size:1.2rem;border:0;border-radius:14px;padding:0 18px;background:var(--pri);color:#fff;cursor:pointer}
#mic{background:var(--ok)}
</style></head><body>
<header><b>🧸 Buddy</b><div class="badges"><span id="lv">L1</span><span id="st">⭐ 0</span><span id="md">LEARNING</span></div></header>
<div id="log"></div>
<form id="f"><button type="button" id="mic" title="Speak">🎤</button><input id="in" autocomplete="off" placeholder="Say hi to Buddy..."><button>Send</button></form>
<script>
const cid = localStorage.cid || (localStorage.cid = "kid-" + Math.random().toString(36).slice(2, 10));
const log = document.getElementById("log"), inp = document.getElementById("in");
function add(t, me) { const d = document.createElement("div"); d.className = "b" + (me ? " me" : ""); d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; }
function speak(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF]/gu, "")); u.lang = "en-US"; u.rate = .85; u.pitch = 1.2; speechSynthesis.speak(u); } catch (e) {} }
async function send(m) {
  add(m, true);
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ child_id: cid, message: m }) });
    const d = await r.json();
    add(d.reply); speak(d.reply);
    lv.textContent = "L" + d.level; st.textContent = "⭐ " + d.stars; md.textContent = d.mode;
    if (d.leveled_up) add("🎉 LEVEL UP! You are on Level " + d.level + "!");
  } catch (e) { add("Oops! Let's try again. 🧸"); }
}
f.onsubmit = e => { e.preventDefault(); const v = inp.value.trim(); if (v) { inp.value = ""; send(v); } };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) { mic.onclick = () => { const r = new SR(); r.lang = "en-US"; r.onresult = e => send(e.results[0][0].transcript); r.start(); }; } else mic.style.display = "none";
add("Hello! I'm Buddy. 🧸 What is your name?");
</script></body></html>
